<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXPANSION</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
    * { cursor: none !important; }

    #content {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none; z-index: 1;
    }
    .nav-frame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none; z-index: 2;
      opacity: 0; pointer-events: none;
    }

    /* ── GMP ── */
    .gmp {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 9000;
      display: flex; align-items: center; gap: 14px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 40px;
      padding: 10px 20px;
      pointer-events: auto;
    }

    .gmp-controls { display: flex; align-items: center; gap: 6px; }

    .gmp-btn {
      background: none; border: none; font-size: 9px;
      color: rgba(255,255,255,0.4); transition: color 0.2s;
      padding: 3px 5px; line-height: 1; letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .gmp-btn:hover { color: rgba(255,255,255,0.9); }
    .gmp-btn--play { font-size: 10px; color: rgba(255,255,255,0.8); }


    /* ── Cursor ── */
    #shell-cur {
      position: fixed; top: -100px; left: -100px;
      pointer-events: none; z-index: 99999;
    }
    #shell-cur::before, #shell-cur::after {
      content: ''; position: absolute; background: #fff;
    }
    #shell-cur::before { width: 1px; height: 20px; top: -10px; left: 0; }
    #shell-cur::after  { width: 20px; height: 1px; top: 0; left: -10px; }
    .cursor { display: none !important; }
  </style>
</head>
<body>

  <div id="shell-cur"></div>

  <iframe id="content" src="index.html" allowfullscreen allow="autoplay"></iframe>

  <div class="gmp" id="gmp">
    <div class="gmp-controls">
      <button class="gmp-btn" id="gmp-prev">&#8592;</button>
      <button class="gmp-btn gmp-btn--play" id="gmp-play">&#9654;</button>
      <button class="gmp-btn" id="gmp-next">&#8594;</button>
    </div>
  </div>

  <audio id="gmp-audio" preload="auto"></audio>

  <script>
    (function() {
      var cur = document.getElementById('shell-cur');
      function moveCursor(x, y) { cur.style.left = x + 'px'; cur.style.top = y + 'px'; }
      function attachToDoc(doc) {
        try { doc.addEventListener('mousemove', function(e) { moveCursor(e.clientX, e.clientY); }); } catch(e) {}
      }
      window._attachToFrame = function attachToFrame(frame) {
        try {
          attachToDoc(frame.contentDocument);
          frame.contentDocument.querySelectorAll('iframe').forEach(function(f) {
            f.addEventListener('load', function() { attachToFrame(f); });
            attachToFrame(f);
          });
          frame.contentDocument.addEventListener('load', function(e) {
            if (e.target.tagName === 'IFRAME') attachToFrame(e.target);
          }, true);
        } catch(e) {}
      };
      document.addEventListener('mousemove', function(e) { moveCursor(e.clientX, e.clientY); });
      var content = document.getElementById('content');
      content.addEventListener('load', function() { window._attachToFrame(content); });
      if (content.contentDocument && content.contentDocument.readyState !== 'loading') {
        window._attachToFrame(content);
      }
    })();
  </script>

  <script type="module">
    import { initGMP, initCursor } from './js/shared.js';
    initGMP();
    initCursor('.gmp');

    // ── Shell-level dissolve transition ───────────────────────────────────────
    let navFrame = null;
    let pendingFadeDur = 2400;

    window.addEventListener('message', e => {
      const d = e.data;
      if (d?.type === 'shell_nav_prepare') {
        // Start loading destination page behind current content
        if (navFrame) navFrame.remove();
        pendingFadeDur = d.fadeDur ?? 2400;
        navFrame = document.createElement('iframe');
        navFrame.src = d.href;
        navFrame.className = 'nav-frame';
        navFrame.setAttribute('allowfullscreen', '');
        navFrame.setAttribute('allow', 'autoplay');
        document.body.appendChild(navFrame);
      } else if (d?.type === 'shell_nav_fade') {
        if (navFrame) {
          navFrame.style.transition = `opacity ${pendingFadeDur / 1000}s ease`;
          navFrame.style.opacity = '1';
        }
      } else if (d?.type === 'navigate') {
        if (navFrame) navFrame.remove();
        const FADE = 900;
        navFrame = document.createElement('iframe');
        navFrame.src = d.href;
        navFrame.className = 'nav-frame';
        navFrame.setAttribute('allowfullscreen', '');
        navFrame.setAttribute('allow', 'autoplay');
        document.body.appendChild(navFrame);
        // Fade in after load (or after 1s max) then swap
        let faded = false;
        function doFade() {
          if (faded || !navFrame) return;
          faded = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (!navFrame) return;
            navFrame.style.transition = `opacity ${FADE / 1000}s ease`;
            navFrame.style.opacity = '1';
            setTimeout(() => {
              if (!navFrame) return;
              const old = document.getElementById('content');
              navFrame.id = 'content';
              navFrame.className = '';
              navFrame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;opacity:1;pointer-events:auto;';
              old?.remove();
              window._attachToFrame(navFrame);
              navFrame = null;
            }, FADE + 100);
          }));
        }
        navFrame.addEventListener('load', doFade, { once: true });
        setTimeout(doFade, 1000); // fallback if load takes too long
      } else if (d?.type === 'shell_nav_done') {
        if (navFrame) {
          const old = document.getElementById('content');
          navFrame.id = 'content';
          navFrame.className = '';
          navFrame.style.transition = 'none';
          navFrame.style.opacity = '1';
          navFrame.style.pointerEvents = 'auto';
          navFrame.style.zIndex = '1';
          old?.remove();
          navFrame = null;
        }
      }
    });
  </script>
</body>
</html>
